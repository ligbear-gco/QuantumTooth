# @file
# @brief Independent opt-in BLE application metadata for Wrynose.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "qtooth-ble"
BBFILE_PATTERN_qtooth-ble = "^${LAYERDIR}/"
BBFILE_PRIORITY_qtooth-ble = "6"
LAYERDEPENDS_qtooth-ble = "core qtooth-platform"
LAYERSERIES_COMPAT_qtooth-ble = "wrynose"

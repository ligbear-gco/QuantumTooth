# @file
# @brief Independent Android workspace; never extend the Pi source projection.
[package]
name = "qtooth-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib"]

[dependencies]
qtooth-ble-core = { path = "../../components/ble/core" }
jni = "=0.21.1"
openssl = "=0.10.82"
serde_json = "=1.0.149"
zeroize = "=1.9.0"

[profile.release]
strip = "debuginfo"
lto = true
codegen-units = 1

schema: spec-driven

context: |
  QuantumTooth has two independent CLI features on one lightweight Rust-first
  Yocto RT platform: qtooth-ble and qtooth-hwe2dr.

  MANDATORY SOURCE-OF-TRUTH PREFLIGHT:
  Before each future feature's planning, artifact generation, implementation,
  verification, sync or archive, read repository-root openspec/DESIGN.md and openspec/HARDWARE.md.
  This config does not inline those files: the agent must actually open them.

  DESIGN.md is immutable authority for architecture, stack, feature independence,
  behavior, recovery ownership and validation gates. HARDWARE.md is immutable
  authority for parts, resources, wiring and electrical/physical constraints.
  Their SVG figures and PlantUML sources are protected derived architecture assets.
  Feature proposals, specs, local design artifacts and tasks must conform to both.
  Neither lower-level artifacts nor external references may silently override them.

  Do not edit, replace or regenerate these SoT documents/assets during feature work.
  Only an explicit user instruction authorizing a SoT revision permits changes.
  If either file is missing, they conflict, a feature conflicts with a baseline,
  or an unresolved gate blocks a decision, report the exact issue and stop dependent
  work. Never guess missing hardware facts or treat an unverified gate as passed.
  Put observations in feature/verification reports; do not rewrite the baseline.

  Keep artifacts compact. Cite relevant baseline IDs (SCOPE, BASE-1..3, BLE-1..5,
  HWE-1..7, G1..5, HW-1..4) and add feature-specific details/acceptance criteria;
  do not copy the architecture or hardware inventories into every spec.

  MANDATORY CONCISION CONTRACT:
  Apply to all chat, progress updates, teaching, context files and OpenSpec artifacts.
  Use the shortest wording that remains accurate, complete and understandable.
  Lead with the answer or action. Remove filler, praise, generic introductions,
  repetition, redundant summaries and unrelated background. Explain each concept
  once; reference SoT IDs instead of restating established context.
  Preserve necessary requirements, mechanisms, non-obvious rationale, commands,
  expected results, evidence, assumptions and material limitations.
  Use short paragraphs, lists or tables only when they improve clarity.
  Keep learning focused on the current task; expand only when needed for correctness,
  understanding or an explicit user request. Brevity must not hide required detail.

  MANDATORY LEARNING CONTRACT:
  Every feature and OpenSpec phase must develop the user's understanding, not
  merely produce artifacts or working code. Teach the relevant Linux OS mechanics,
  Yocto, BLE/PQC, Rust, and FPGA/VAE concepts; do not force unrelated lessons.
  State 1-3 learning outcomes and prerequisites per feature. Explain the mechanism,
  component boundaries, data/control flow, and reasons for consequential choices.
  Define unfamiliar terms and connect abstractions to concrete project behavior.

  Work in small, coherent increments. Before substantive commands or edits, briefly
  explain their purpose, what they exercise, and the expected result; afterward
  compare evidence with expectations and explain failures or limitations.
  Include a reproducible hands-on experiment with expected observations and a
  short optional prediction/explain-back question. Distinguish measured facts,
  assumptions, and open questions. Summarize what was learned at completion.
  Keep teaching concise and tied to the current feature; put explanations in the
  conversation/change artifacts, not repeated SoT content or unnecessary code comments.
  Optional knowledge checks must not become approval gates or block authorized work.
  Questions and exploration do not authorize implementation or SoT revisions.

rules:
  proposal:
    - State affected baseline IDs and whether the feature conforms to both SoTs.
    - State learning outcomes, prerequisites, and the mechanism the feature will make observable.
  specs:
    - Derive testable requirements within the baseline; link SoT IDs instead of duplicating design.
    - Include a learner-run experiment with expected observations; do not add product features solely to test the user's knowledge.
  design:
    - Describe only change-specific implementation decisions within DESIGN.md and HARDWARE.md.
    - Explain relevant OS/hardware boundaries, data flow, tradeoffs, and Rust safety/FFI implications in plain language.
  tasks:
    - Include relevant feasibility/validation gates; never include unauthorized SoT edits.
    - Organize increments as learn, build, inspect, and explain; identify commands, expected evidence, and what each increment teaches.

operations:
  apply:
    guidance:
      - Re-read both root SoTs before implementation; preserve their documents and diagram assets.
      - Teach each meaningful increment before execution, inspect its evidence afterward, and offer an optional hands-on knowledge check.
  archive:
    guidance:
      - Recheck SoT conformance; never replace root DESIGN.md with a change-local design artifact.
      - Summarize demonstrated learning outcomes, measured results, remaining misconceptions or uncertainties, and one useful next experiment.

# @file
# @brief BLE diagnostic workspace; Cargo.lock fixes all dependency versions.
[package]
name = "qtooth-ble"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "QuantumTooth authenticated PQC sessions and bounded BLE diagnostic"

[workspace]
members = ["core"]
resolver = "3"

[dependencies]
qtooth-ble-core = { path = "core" }
zeroize = "1.9"
bluer = { version = "=0.17.4", features = ["bluetoothd"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time", "net", "io-util", "process"] }
uuid = "1"

[dev-dependencies]
dbus = "=0.9.12"
dbus-crossroads = "=0.5.3"
dbus-tokio = "=0.7.6"
tokio = { version = "1", features = ["test-util"] }
